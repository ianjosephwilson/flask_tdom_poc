[project]
name="flask_tdom_poc"
dynamic = ["version"]
dependencies = [
    "flask",
    "tdom",
    "flask_tdom_poc"
]
requires-python = ">= 3.14"
description = "Flask renderer for TDOM."
authors = [
  {name = "Ian Wilson", email = "ian@gardentheory.com"}
]
readme="README.rst"
license="MIT"

[project.optional-dependencies]
dev = [
    "twine", # Check RST
]


[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"
default-version = "0.0.0+unknown"

[tool.hatch.build.hooks.versioningit-onbuild]
source-file="src/flask_tdom_poc/__about__.py"
build-file="flask_tdom_poc/__about__.py"

[tool.pyright]
include = ["src/flask_tdom_poc"]
